<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ugens forløb: køleskab, menu, pris, bestil, I betaler</title>
  <style>
    .bg { fill: #ffffff; }
    .kort { fill: #f6f8fa; stroke: #d0d7de; }
    .tal { fill: #1f6feb; }
    .taltekst { fill: #ffffff; font-weight: 700; font-size: 16px; }
    .titel { fill: #1f2328; font-weight: 700; font-size: 17px; }
    .tekst { fill: #59636e; font-size: 13px; }
    .pil { stroke: #8c959f; stroke-width: 2; fill: none; }
    .spids { fill: #8c959f; }
    .betal { fill: #dafbe1; stroke: #4ac26b; }
    .hoved { fill: #1f2328; font-weight: 700; font-size: 20px; }
    .under { fill: #59636e; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .kort { fill: #161b22; stroke: #30363d; }
      .titel, .hoved { fill: #e6edf3; }
      .tekst, .under { fill: #9198a1; }
      .pil { stroke: #6e7681; }
      .spids { fill: #6e7681; }
      .betal { fill: #12261e; stroke: #2ea043; }
    }
  </style>
  <rect class="bg" width="960" height="280" rx="12"/>
  <text class="hoved" x="32" y="44">Én uge med ugeplan-mcp</text>
  <text class="under" x="32" y="68">Husstanden svarer i Telegram. AI-assistenten planlægger og fylder kurven. I betaler selv.</text>

  <g transform="translate(32,96)">
    <rect class="kort" width="160" height="160" rx="10"/>
    <circle class="tal" cx="28" cy="30" r="15"/><text class="taltekst" x="28" y="36" text-anchor="middle">1</text>
    <text class="titel" x="16" y="74">Køleskabet</text>
    <text class="tekst" x="16" y="100">"Hvad har I?"</text>
    <text class="tekst" x="16" y="120">sendes til alle</text>
    <text class="tekst" x="16" y="140">telefoner</text>
  </g>
  <g transform="translate(222,96)">
    <rect class="kort" width="160" height="160" rx="10"/>
    <circle class="tal" cx="28" cy="30" r="15"/><text class="taltekst" x="28" y="36" text-anchor="middle">2</text>
    <text class="titel" x="16" y="74">Menu</text>
    <text class="tekst" x="16" y="100">Profil, tilbud og</text>
    <text class="tekst" x="16" y="120">favoritter. I retter</text>
    <text class="tekst" x="16" y="140">i chatten</text>
  </g>
  <g transform="translate(412,96)">
    <rect class="kort" width="160" height="160" rx="10"/>
    <circle class="tal" cx="28" cy="30" r="15"/><text class="taltekst" x="28" y="36" text-anchor="middle">3</text>
    <text class="titel" x="16" y="74">Pris</text>
    <text class="tekst" x="16" y="100">nemlig mod Bilka</text>
    <text class="tekst" x="16" y="120">med levering og</text>
    <text class="tekst" x="16" y="140">minimumskøb</text>
  </g>
  <g transform="translate(602,96)">
    <rect class="kort" width="160" height="160" rx="10"/>
    <circle class="tal" cx="28" cy="30" r="15"/><text class="taltekst" x="28" y="36" text-anchor="middle">4</text>
    <text class="titel" x="16" y="74">"bestil"</text>
    <text class="tekst" x="16" y="100">Kurven fyldes.</text>
    <text class="tekst" x="16" y="120">Menu og levering</text>
    <text class="tekst" x="16" y="140">sendes til jer</text>
  </g>
  <g transform="translate(792,96)">
    <rect class="kort betal" width="136" height="160" rx="10"/>
    <circle class="tal" cx="28" cy="30" r="15"/><text class="taltekst" x="28" y="36" text-anchor="middle">5</text>
    <text class="titel" x="16" y="74">I betaler</text>
    <text class="tekst" x="16" y="100">i butikkens</text>
    <text class="tekst" x="16" y="120">app. Botten</text>
    <text class="tekst" x="16" y="140">betaler aldrig</text>
  </g>

  <g>
    <path class="pil" d="M194 176 H216"/><path class="spids" d="M220 176 l-7 -5 v10 z"/>
    <path class="pil" d="M384 176 H406"/><path class="spids" d="M410 176 l-7 -5 v10 z"/>
    <path class="pil" d="M574 176 H596"/><path class="spids" d="M600 176 l-7 -5 v10 z"/>
    <path class="pil" d="M764 176 H786"/><path class="spids" d="M790 176 l-7 -5 v10 z"/>
  </g>
</svg>
