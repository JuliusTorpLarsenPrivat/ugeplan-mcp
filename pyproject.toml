[project]
name = "ugeplan-mcp"
version = "0.31.0"
description = "Ugens madplan for hele husstanden via Telegram, med kurven fyldt hos nemlig.com eller BilkaToGo. Du betaler altid selv."
readme = "README.md"
license = "MIT"
authors = [{ name = "Julius Torp Larsen" }]
keywords = ["mcp", "claude", "madplan", "nemlig", "bilkatogo", "telegram", "dagligvarer"]

requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "tzdata>=2024.1; sys_platform == 'win32'",  # tidszoner (Europe/Copenhagen) findes ikke i Windows
]

[project.urls]
Repository = "https://github.com/JuliusTorpLarsenPrivat/ugeplan-mcp"

[project.scripts]
ugeplan-mcp = "handle_mcp.server:main"
handle-mcp = "handle_mcp.server:main"  # det gamle navn virker stadig

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
